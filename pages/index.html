<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASI RUSH has moved</title>
    <link rel="canonical" href="https://asi-rush.technoir.cloud/" />
    <script>
      // Browser storage is per domain: take this player's save along in the URL fragment (never sent to a server).
      var data = {};
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('asi-rush') === 0) data[k] = localStorage.getItem(k);
        }
      } catch (e) {}
      var hash = Object.keys(data).length ? '#migrate=' + encodeURIComponent(JSON.stringify(data)) : '';
      location.replace('https://asi-rush.technoir.cloud/' + hash);
    </script>
  </head>
  <body style="background: #0e0c14; color: #e8e0d0; font-family: monospace; padding: 2em">
    <p>
      ASI RUSH has moved to
      <a href="https://asi-rush.technoir.cloud/" style="color: #ffcf6a">asi-rush.technoir.cloud</a>.
    </p>
  </body>
</html>
